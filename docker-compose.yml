services:
  postgres:
    image: postgres:16
    container_name: pooja-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pooja_store
    ports:
      - "5432:5432"
    volumes:
      - pooja-store-postgres-data:/var/lib/postgresql/data

volumes:
  pooja-store-postgres-data:
